<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light"><title>Design Builder — 选择你的设计起点</title><link rel="stylesheet" href="/styles.css"><script type="module" src="/app.js"></script></head>
<body>
<a class="skip-link" href="#main">跳到主要内容</a>
<header class="header">
  <a href="/" class="brand" aria-label="Design Builder 首页"><img class="brand-logo" src="/logos/design-builder.png" width="32" height="32" alt=""><span>Design Builder</span></a>
  <nav class="top-nav" aria-label="主导航"><button class="nav-link active" id="library-nav">设计系统</button><button class="nav-link" id="project-nav">我的项目</button><button class="nav-link" id="guide-nav">使用指南</button></nav>
  <label class="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></svg><input id="search" type="search" placeholder="搜索设计系统" aria-label="搜索设计系统"><kbd>/</kbd></label>
  <button class="project-pill" id="project-pill"><span class="status-dot"></span><span id="project-name">本地项目</span></button>
</header>
<div class="workspace">
  <main id="main" tabindex="-1"><div id="loading" class="loading">正在读取设计系统…</div><section id="gallery" hidden aria-labelledby="gallery-title"><div class="gallery-intro"><div class="page-kicker step-label"><button id="gallery-step-back" class="back-button" type="button" aria-label="返回上一步：选择组件底座" title="返回上一步：选择组件底座" hidden><span aria-hidden="true">←</span></button><p id="selection-step">第 1 步，共 2 步</p></div><h1 id="gallery-title">选择你的设计起点</h1><p id="gallery-lead">浏览下方开源组件，查看详情后选择一套作为项目的组件底座。也可以选择“不使用预设组件”，继续下一步选择设计参考。</p></div><p id="gallery-error" class="form-error" role="alert" hidden></p><div id="flow-summary" class="flow-summary" hidden></div><div id="preset-list" class="system-grid" aria-label="预设设计系统"></div><section id="custom-references" class="custom-references" hidden aria-labelledby="custom-reference-title"><button id="toggle-custom-reference" class="system-card" data-brand="custom" type="button" aria-expanded="false" aria-controls="custom-reference-content"><span class="system-logo" aria-hidden="true"><img src="/logos/custom-reference.svg" width="36" height="36" alt=""></span><span class="card-watermark" aria-hidden="true"><img src="/logos/custom-reference.svg" width="64" height="64" alt=""></span><span id="custom-reference-title" class="system-card-name">使用你自己的参考</span><span class="system-card-publisher">自定义 URL</span><span class="card-arrow" aria-hidden="true">＋</span></button><div id="custom-reference-content" class="custom-reference-content" aria-hidden="true" inert><div class="custom-reference-inner"><div class="custom-reference-body"><form id="reference-form"><label class="field-label" for="custom-reference-url">参考网页 URL</label><div class="reference-input-row"><input id="custom-reference-url" class="text-input" type="url" placeholder="https://你想参考的页面" maxlength="2000" required></div><div class="reference-actions"><button id="finish-reference" class="primary-button" type="submit">使用此 URL</button><button id="skip-reference" class="text-button" type="button">不使用设计参考</button></div></form><p id="reference-error" class="form-error" role="alert" hidden></p></div></div></div></section><p id="empty-search" hidden>没有找到匹配的系统，试试品牌或技术栈名称。</p></section><div id="detail" hidden></div><section id="conversation" hidden aria-labelledby="conversation-title"><div class="conversation-content"><div class="page-kicker step-label"><button id="conversation-back" class="back-button" type="button" aria-label="重新选择设计起点" title="重新选择设计起点"><span aria-hidden="true">←</span></button><p>设计起点已保存</p></div><h1 id="conversation-title">回到对话，开始构建</h1><p class="conversation-lead">在宿主中描述你的需求，继续构建设计系统与页面。</p><button id="conversation-basis" class="basis-chip"></button><a id="return-host" class="primary-button" hidden>返回原宿主会话 ↗</a><p id="return-note" class="conversation-lead"></p><p class="conversation-lead">目标项目：<span id="return-project-path"></span></p><details class="return-fallback"><summary>需要交接说明？</summary><p>宿主没有找到选择文件时，将这段说明与需求一起发送。</p><textarea id="return-instructions" readonly rows="5" aria-label="宿主交接说明"></textarea><button id="copy-return" class="text-button">复制交接说明</button></details></div></section></main>
</div>
<dialog id="project-dialog" aria-labelledby="dialog-title"><div class="dialog-heading"><span class="eyebrow">YOUR PROJECT</span><button id="close-dialog" class="icon-button" aria-label="关闭">×</button></div><h2 id="dialog-title">项目的设计起点</h2><p class="dialog-lead">选择组件底座，再加入可选的视觉参考。</p><div id="dialog-selection"></div></dialog>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body></html>
